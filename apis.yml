aid: rome2rio
name: Rome2Rio
description: >-
  Rome2Rio is a multi-modal travel planning platform founded in Melbourne,
  Australia in 2011, and part of the Omio Group since 2019. It covers 240+
  countries, 10 million+ locations, and 20,000+ transport operators, enabling
  door-to-door route discovery across flights, trains, buses, ferries, and
  driving. Developers can access route search, geocoding, and autocomplete
  capabilities through the Rome2Rio REST API, which returns JSON responses
  covering routes, segments, duration, and operator information for any two
  points worldwide.
