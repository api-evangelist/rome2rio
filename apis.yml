apis:
  - aid: rome2rio:search
    name: Rome2Rio Search API
    description: >-
      The Rome2Rio Search API returns multi-modal door-to-door travel routes
      between any origin and destination worldwide. Given origin and destination
      as place names or coordinates, it returns a ranked list of routes covering
      flights, trains, buses, ferries, and driving, with segment details,
      durations, operators, and indicative pricing information. Responses are
      JSON over HTTP. The API covers 700+ airlines and 2 million surface routes.
    humanURL: https://www.rome2rio.com/documentation/1-4/search/
    baseURL: http://free.rome2rio.com/api/1.4
    tags:
      - Travel
      - Routes
      - Multi-Modal
      - Transportation
      - Transit
      - Flights
      - Trains
      - Buses
      - Ferries
    properties:
      - type: Documentation
        url: https://www.rome2rio.com/documentation/1-4/search/
  - aid: rome2rio:autocomplete
    name: Rome2Rio Autocomplete API
    description: >-
      The Rome2Rio Autocomplete API provides place-name suggestions as a user
      types, returning a ranked list of matching locations (cities, airports,
      train stations, addresses) that can be passed as origin or destination to
      the Search API. Responses are JSON and the endpoint is hosted on the same
      free.rome2rio.com base.
    humanURL: https://www.rome2rio.com/documentation/1-4/autocomplete/
    baseURL: http://free.rome2rio.com/api/1.4
    tags:
      - Autocomplete
      - Places
      - Geocoding
      - Travel
    properties:
      - type: Documentation
        url: https://www.rome2rio.com/documentation/1-4/autocomplete/
  - aid: rome2rio:geocode
    name: Rome2Rio Geocode API
    description: >-
      The Rome2Rio Geocode API resolves a place-name or address string to a
      canonical Rome2Rio place record with geographic coordinates, place type,
      and country, enabling precise origin and destination inputs for the Search
      API. Responses are JSON.
    humanURL: https://www.rome2rio.com/documentation/1-4/geocode/
    baseURL: http://free.rome2rio.com/api/1.4
    tags:
      - Geocoding
      - Places
      - Coordinates
      - Travel
    properties:
      - type: Documentation
        url: https://www.rome2rio.com/documentation/1-4/geocode/
