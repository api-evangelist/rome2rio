description: FinOps framework definition for the Rome2Rio API surface. Provides a
  FOCUS-aligned mapping for cost allocation, usage measurement, and unit-economics
  reporting. The Basic Access tier is free up to 100,000 requests/month; the Commercial
  tier is contract-priced. FinOps focus is on tracking request volume against the
  monthly quota, forecasting growth, and making the tier upgrade decision visible.
principles:
  - name: Visibility
    description: Make Rome2Rio API consumption visible to engineering and product teams
      so quota burn is understood before the monthly limit is reached.
  - name: Allocation
    description: Tag every chargeable API call with the consuming team, environment,
      application, and feature for accurate showback.
  - name: Optimization
    description: Cache route results where TTL permits, batch geocode lookups, and
      debounce autocomplete calls to minimize billable request volume.
  - name: Accountability
    description: Establish a budget owner and upgrade trigger for the Basic-to-Commercial
      tier transition so cost surprises are avoided.
